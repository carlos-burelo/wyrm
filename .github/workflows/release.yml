name: Release and Publish Wyrm

on:
  push:
    tags:
      - 'v*'

jobs:
  build-rust:
    name: Build Rust Binary (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Release Binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Prepare Release Asset
        run: |
          mkdir dist
          cp target/x86_64-pc-windows-msvc/release/wyrm.exe dist/wyrm-x86_64-pc-windows-msvc.exe

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/wyrm-x86_64-pc-windows-msvc.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish Wrapper to npm
    needs: build-rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Sync Version in package.json
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          cd npm
          npm version $TAG_VERSION --no-git-tag-version

      - name: Publish to npm
        run: |
          cd npm
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}