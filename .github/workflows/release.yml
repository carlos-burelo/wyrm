name: Release and Publish Wyrm

on:
  push:
    tags:
      - 'v*'

# El tag dispara todo: tests -> binario x64 -> GitHub Release -> npm.
# Requiere el secret NPM_TOKEN (token de npm con acceso al paquete wyrm).

permissions:
  contents: write

jobs:
  build-rust:
    name: Test + Build + Release (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test -p wyrm

      - name: Build Release Binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Prepare Release Assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/wyrm.exe dist/wyrm-x86_64-pc-windows-msvc.exe
          $hash = (Get-FileHash dist/wyrm-x86_64-pc-windows-msvc.exe -Algorithm SHA256).Hash.ToLower()
          [System.IO.File]::WriteAllText("$PWD/dist/wyrm-x86_64-pc-windows-msvc.exe.sha256", "$hash`n")
          Get-Content dist/wyrm-x86_64-pc-windows-msvc.exe.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/wyrm-x86_64-pc-windows-msvc.exe
            dist/wyrm-x86_64-pc-windows-msvc.exe.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish Wrapper to npm
    needs: build-rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Validate tag and sync version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag inválido: $TAG (usa vX.Y.Z)"
            exit 1
          fi
          TAG_VERSION="${TAG#v}"
          cd npm
          npm version "$TAG_VERSION" --no-git-tag-version
          node -e "const m=require('./scripts/install.js'); console.log('install check:', m.assetName(m.targetTriple()), 'v'+m.pkgVersion())"

      - name: Publish to npm
        run: |
          cd npm
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
