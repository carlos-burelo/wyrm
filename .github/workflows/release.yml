name: Release and Publish Wyrm

on:
  push:
    tags:
      - 'v*'

# El tag dispara: tests -> e2e -> binario x64 -> GitHub Release.
# CI NUNCA publica a npm (sin NPM_TOKEN a propósito): la publicación
# es manual del mantenedor con el tarball verificado.

permissions:
  contents: write

jobs:
  build-rust:
    name: Test + Build + Release (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test -p wyrm

      - name: Build Release Binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Run e2e (despliegue + ciclo + prod)
        run: pnpm test:e2e

      - name: Prepare Release Assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/wyrm.exe dist/wyrm-x86_64-pc-windows-msvc.exe
          $hash = (Get-FileHash dist/wyrm-x86_64-pc-windows-msvc.exe -Algorithm SHA256).Hash.ToLower()
          [System.IO.File]::WriteAllText("$PWD/dist/wyrm-x86_64-pc-windows-msvc.exe.sha256", "$hash`n")
          Get-Content dist/wyrm-x86_64-pc-windows-msvc.exe.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/wyrm-x86_64-pc-windows-msvc.exe
            dist/wyrm-x86_64-pc-windows-msvc.exe.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload binary for npm tarball
        uses: actions/upload-artifact@v4
        with:
          name: wyrm-windows-x64
          path: dist/wyrm-x86_64-pc-windows-msvc.exe
          if-no-files-found: error
